apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: file-demo
type: Opaque
stringData:
  # RabbitMQ Management API URL used by KEDA to query queue length
  host: "http://guest:guest@rabbitmq-service.file-demo.svc.cluster.local:15672/"
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-rabbitmq-auth
  namespace: file-demo
spec:
  secretTargetRef:
  - parameter: host
    name: rabbitmq-credentials
    key: host
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rabbitmq-receiver-scaler
  namespace: file-demo
spec:
  scaleTargetRef:
    name: receiver-deployment
  minReplicaCount: 1       # Scale down to 1 pod (can be 0 if fully idle)
  maxReplicaCount: 10      # Maximum worker pods
  pollingInterval: 5       # Query RabbitMQ queue depth every 5 seconds
  cooldownPeriod: 10       # Seconds to wait before scaling down after queue is empty
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 10   # Override Kubernetes 5-minute default for fast demo scale-down
          policies:
          - type: Percent
            value: 100
            periodSeconds: 10
  triggers:
  - type: rabbitmq
    metadata:
      protocol: http
      queueName: file_processing_queue
      mode: QueueLength
      value: "3"           # Add 1 pod for every 3 messages waiting in queue
    authenticationRef:
      name: keda-rabbitmq-auth
